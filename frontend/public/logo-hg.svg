<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 116" fill="none" role="img" aria-label="Haji Gul HG Monogram Logo">
  <defs>
    <linearGradient id="hg-pillar-bevel" x1="10" y1="16" x2="26" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#608FD4" />
      <stop offset="50%" stop-color="#2A589C" />
      <stop offset="100%" stop-color="#163566" />
    </linearGradient>
    <linearGradient id="hg-pillar-main" x1="18" y1="10" x2="36" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="55%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="hg-pillar-right" x1="68" y1="8" x2="88" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
