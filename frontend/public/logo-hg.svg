    <linearGradient id="hg-ribbon" x1="10" y1="68" x2="100" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="35%" stop-color="#2563EB" />
      <stop offset="75%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
    <linearGradient id="hg-g-arc" x1="88" y1="12" x2="164" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
