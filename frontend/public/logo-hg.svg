  <path d="M 48 27 Q 63 58 48 89" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round" />

  <polygon points="8,22 18,16 18,98 8,104" fill="url(#hg-pillar-bevel)" />
  <polygon points="18,16 29,10 29,104 18,98" fill="url(#hg-pillar-main)" />

  <polygon points="69,16 86,6 86,101 69,111" fill="url(#hg-pillar-right)" />

  <path
